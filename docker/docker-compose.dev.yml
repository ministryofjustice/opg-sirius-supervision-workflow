services:
  workflow:
    build:
      target: dev
    ports:
      - '2345:2345'
    privileged: false
    user: root
    volumes:
      - ./.air.toml:/app/.air.toml
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
      - ./internal:/app/internal
      - ./main_test.go:/app/main_test.go
      - ./main.go:/app/main.go
      - ./web/static/javascript:/app/web/static/javascript
      - ./web/template:/app/web/template

  watch-assets:
    command: -lc "apk add --no-cache git && npm ci --ignore-scripts && npm run watch"

  json-server:
    build:
      dockerfile: docker/json-server/Dockerfile
    volumes:
      - ./json-server/config:/app/config
    ports:
      - '3000:3000'
