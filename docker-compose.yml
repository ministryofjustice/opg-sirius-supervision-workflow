services:
  workflow:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/sirius-workflow:latest
    build:
      dockerfile: docker/sirius-workflow/Dockerfile
    privileged: false
    user: app
    read_only: true
    environment:
      PORT: 8888
      HEALTHCHECK: "/supervision/workflow/health-check"
      SIRIUS_URL: http://json-server:3000
      SHOW_BONDS_WITHOUT_ORDERS: 1
      LOG_LEVEL: DEBUG

  json-server:
    build:
      dockerfile: docker/json-server/Dockerfile

  local-proxy:
    image: nginx:1.31-alpine@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
    ports:
      - '8888:80'
    volumes:
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - workflow
      - json-server

  test-runner:
    build:
      dockerfile: docker/test-runner/Dockerfile
    working_dir: /go/src/app
    volumes:
      - ./:/go/src/app

  cypress:
    build:
      dockerfile: docker/cypress/Dockerfile
    command: [ "--headless", "-b", "electron", "--env", "grepUntagged=true" ]
    volumes:
      - ./cypress/screenshots:/root/cypress/screenshots:rw,delegated
      - ./cypress/logs:/root/cypress/logs:rw,delegated
    depends_on:
      - local-proxy

  go-lint:
    image: golangci/golangci-lint:v2.14.0@sha256:ad862ba6b3798cbe0fd9fd7408d498fd74fbd2623a92406b2fd3898faf0bf98f
    working_dir: /go/src/app
    volumes:
      - ./:/go/src/app
      - ./.cache/golangci-lint/v2.2.1:/root/.cache
    command: golangci-lint run -v --timeout 5m

  gosec:
    image: securego/gosec:latest@sha256:2cf71ea78210c496c65e3a987576a9c8317b68e20f2960520b3f6f8f9f539be5
    working_dir: /app
    environment:
      GOTOOLCHAIN: auto
    volumes:
      - .:/app
    command: -exclude-dir=.gocache -fmt=sarif -out=/app/test-results/gosec.sarif -stdout -verbose=text /app/...

  watch-assets:
    image: node:24-alpine3.23@sha256:595398b0081eacda8e1c4c5b97b76cd1020e4d58a8ebcb4843b9bca1e79e7436
    working_dir: /home/node/app
    entrypoint: ["sh"]
    volumes:
      - ./:/home/node/app
      - watch-assets-node-modules:/home/node/app/node_modules

  pact-cli:
    image: pactfoundation/pact-cli:1.5.0.5@sha256:77b98079e5be279353f61e116a0b9b3af19e55b215532b30d430ff5df66e5ac9
    working_dir: /go/src/app
    volumes:
      - ./pacts:/go/src/app/pacts

volumes:
  watch-assets-node-modules:
